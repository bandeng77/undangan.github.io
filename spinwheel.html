<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wheel of Fortune | Lucky Draw Hadiah Spesial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0f111a 0%, #1e2436 100%);
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 20% 40%, rgba(255,215,0,0.06) 2px, transparent 2px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .wheel-container {
            max-width: 1400px;
            width: 100%;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(12px);
            border-radius: 64px;
            padding: 20px 30px 35px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,215,0,0.2);
            border: 1px solid rgba(255,215,0,0.35);
        }

        .event-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .event-header h1 {
            font-size: 2.3rem;
            background: linear-gradient(135deg, #FFE0A3, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        .event-header p {
            color: #ccc;
            font-size: 0.9rem;
        }

        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin: 20px 0 25px;
        }

        .wheel-section {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            width: 460px;
            height: 460px;
            max-width: 100%;
            border-radius: 50%;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), 0 0 0 10px rgba(255,215,0,0.2), 0 0 0 16px rgba(0,0,0,0.4);
            background: #2a2f3f;
        }

        .spin-btn {
            margin-top: 30px;
            background: linear-gradient(120deg, #FFD966, #FFA559);
            border: none;
            padding: 14px 45px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 60px;
            color: #1e1e2a;
            cursor: pointer;
            box-shadow: 0 8px 0 #b4621a;
            transition: 0.08s linear;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .spin-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b4621a;
        }

        .spin-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        /* Prize Panel */
        .info-panel {
            flex: 0.9;
            min-width: 300px;
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 20px;
            border: 1px solid rgba(255,215,0,0.4);
        }

        .prize-selector {
            background: linear-gradient(135deg, #1e2436, #151a28);
            border-radius: 32px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .prize-title {
            font-size: 1rem;
            color: #FFD966;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prize-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }

        .prize-card {
            background: rgba(0,0,0,0.55);
            border-radius: 20px;
            padding: 8px 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            text-align: center;
        }

        .prize-card:hover:not(.disabled) {
            transform: translateY(-3px);
            background: rgba(255,215,0,0.2);
        }

        .prize-card.selected {
            border-color: #FFD966;
            background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,180,0,0.2));
            box-shadow: 0 0 12px rgba(255,215,0,0.5);
        }

        .prize-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.3);
        }

        .prize-name {
            font-weight: bold;
            color: #fff;
            font-size: 0.85rem;
        }

        .prize-stock {
            font-size: 0.7rem;
            color: #FFD966;
            margin-top: 4px;
        }

        .prize-icon {
            font-size: 1.5rem;
        }

        .winner-card {
            text-align: center;
            background: linear-gradient(135deg, #1e2436, #131826);
            border-radius: 40px;
            padding: 18px 12px;
            margin-bottom: 18px;
            border-bottom: 3px solid #FFD966;
        }

        .winner-label {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #FFD966;
        }

        .winner-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 6px 0;
            background: linear-gradient(135deg, #fff, #FFE0A3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .winner-company, .winner-prize {
            font-size: 0.9rem;
            background: rgba(255,215,0,0.18);
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            margin: 4px 5px;
            color: #FFE0A3;
        }

        .guest-stats {
            background: rgba(0,0,0,0.4);
            border-radius: 28px;
            padding: 12px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            color: #ddd;
            padding: 5px 0;
            font-size: 0.8rem;
        }

        .history-section {
            margin-top: 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 32px;
            padding: 16px;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255,255,255,0.07);
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            border-left: 3px solid #FFD966;
        }

        .history-prize {
            background: #FFD966;
            color: #1e1e2a;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .reset-btn {
            background: rgba(220, 53, 69, 0.85);
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.8rem;
        }

        .toast-msg {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFD966;
            color: #1e1e2a;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 1100;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 55px;
            height: 55px;
            border: 5px solid rgba(255,215,0,0.3);
            border-top: 5px solid #FFD966;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Confetti canvas dengan teks pemenang */
        .confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        
        /* Tombol Try Again kecil di atas konfeti */
        .tryagain-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid #FFD966;
            color: #FFD966;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tryagain-btn:hover {
            background: #FFD966;
            color: #1e1e2a;
            transform: scale(1.02);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="wheel-container">
    <div class="event-header">
        <h1><i class="fas fa-gift"></i> Lucky Draw</h1>
    </div>

    <div class="main-layout">
        <div class="wheel-section">
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <button class="spin-btn" id="spinButton"><i class="fas fa-play"></i> SPIN</button>
        </div>

        <div class="info-panel">
            <div class="prize-selector">
                <div class="prize-title"><i class="fas fa-trophy"></i> Pilih Doorprize</div>
                <div class="prize-options" id="prizeContainer"></div>
            </div>
            <div class="winner-card">
                <div class="winner-label">🏆 PEMENANG TERBARU 🏆</div>
                <div class="winner-name" id="winnerName">—</div>
                <div id="winnerCompany" class="winner-company">—</div>
                <div id="winnerPrizeDisplay" class="winner-prize">—</div>
            </div>
            <div class="guest-stats">
                <div class="stat-item"><span><i class="fas fa-users"></i> Total Tamu</span><span id="totalGuests">0</span></div>
                <div class="stat-item"><span><i class="fas fa-history"></i> Sudah Menang</span><span id="wonCount">0</span></div>
                <div class="stat-item"><span><i class="fas fa-undo-alt"></i> Sisa Belum Menang</span><span id="remainingCount">0</span></div>
            </div>
        </div>
    </div>

    <div class="history-section">
        <div class="history-title"><i class="fas fa-list-ul"></i> History Pemenang & Hadiah</div>
        <div class="history-list" id="historyList">Memuat...</div>
        <div style="display: flex; justify-content: flex-end;">
            <button class="reset-btn" id="resetAllBtn"><i class="fas fa-trash-alt"></i> Reset Semua Pemenang</button>
        </div>
    </div>
</div>
<div id="toastMsg" class="toast-msg"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<script>
    // ---------- FIREBASE (sama dengan admin panel) ----------
    const firebaseConfig = {
        apiKey: "AIzaSyC8LlcI_ccRGieFNjlVFLfEr2c4PBg6J70",
        authDomain: "logbook-e6ab3.firebaseapp.com",
        databaseURL: "https://logbook-e6ab3-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "logbook-e6ab3",
        storageBucket: "logbook-e6ab3.firebasestorage.app",
        messagingSenderId: "484546392348",
        appId: "1:484546392348:web:861616b680427c158ecad9"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const rsvpRef = database.ref('rsvps');
    const winnersRef = database.ref('wheel_winners_v2'); // menyimpan { name, company, prize, timestamp }

    // ---------- DAFTAR HADIAH (dengan stok) - Voucher MAP 5 -> sisa 3 karena 2 sudah keluar ----------
    let prizes = [
        { id: "tv", name: "TV 43 Inch", icon: "📺", stock: 1, initialStock: 1 },
        { id: "smartphone", name: "Smartphone", icon: "📱", stock: 2, initialStock: 2 },
        { id: "speaker", name: "Speaker Portable", icon: "🔊", stock: 1, initialStock: 1 },
        { id: "tws", name: "TWS Earbud", icon: "🎧", stock: 1, initialStock: 1 },
        { id: "smartwatch", name: "Smartwatch", icon: "⌚", stock: 1, initialStock: 1 },
        // Voucher MAP 500rb, stock awal 5, nanti akan berkurang sesuai history (2 sudah keluar jadi sisa 3)
        { id: "voucher_map", name: "Voucher MAP 500rb", icon: "🧾", stock: 3, initialStock: 3 }
    ];

    let guestsList = [];            // { id, name, company }
    let winnersHistory = [];        // { name, company, prize, timestamp }
    let availableIndices = [];      // index di guestsList yang belum pernah menang
    let currentSpinInProgress = false;
    let currentRotation = 0;
    let wheelSegments = [];
    let selectedPrize = null;       // prize object yang dipilih
    
    // Daftar nama yang akan DIHAPUS dari spin (tidak boleh ikut undian)
    const excludedNames = ["Muhammad Rahmat Hidayat", "Fx Agung Yulyanto"];

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinButton');

    // Helper UI
    function showLoading(show) {
        const overlay = document.getElementById('loadingOverlay');
        if (show) overlay.style.display = 'flex';
        else overlay.style.display = 'none';
    }

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.backgroundColor = isError ? '#e74c3c' : '#FFD966';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2800);
    }

    // ========== KONFETI DENGAN NAMA PEMENANG + TOMBOL TRY AGAIN ==========
    let activeTryAgainBtn = null;
    
    function startWinnerConfetti(winnerName, prizeName, onTryAgain) {
        // Hapus tombol try again sebelumnya jika ada
        if (activeTryAgainBtn && document.body.contains(activeTryAgainBtn)) {
            activeTryAgainBtn.remove();
            activeTryAgainBtn = null;
        }
        
        // Buat canvas konfeti
        const confettiCanvas = document.createElement('canvas');
        confettiCanvas.classList.add('confetti-canvas');
        document.body.appendChild(confettiCanvas);
        
        // Buat tombol Try Again kecil di pojok kanan bawah (hanya saat konfeti aktif)
        const tryAgainBtn = document.createElement('button');
        tryAgainBtn.innerHTML = '<i class="fas fa-redo-alt"></i> Try Again (Tidak Hadir)';
        tryAgainBtn.className = 'tryagain-btn';
        tryAgainBtn.style.position = 'fixed';
        tryAgainBtn.style.bottom = '30px';
        tryAgainBtn.style.right = '30px';
        tryAgainBtn.style.zIndex = '10001';
        document.body.appendChild(tryAgainBtn);
        activeTryAgainBtn = tryAgainBtn;
        
        // Event handler untuk tombol try again
        const handleTryAgain = () => {
            if (onTryAgain && typeof onTryAgain === 'function') {
                onTryAgain();
            }
            // Hapus canvas confetti dan tombol
            if (confettiCanvas && confettiCanvas.parentNode) confettiCanvas.remove();
            if (tryAgainBtn && tryAgainBtn.parentNode) tryAgainBtn.remove();
            if (activeTryAgainBtn === tryAgainBtn) activeTryAgainBtn = null;
        };
        tryAgainBtn.addEventListener('click', handleTryAgain, { once: true });
        
        let w = window.innerWidth;
        let h = window.innerHeight;
        confettiCanvas.width = w;
        confettiCanvas.height = h;
        let ctxc = confettiCanvas.getContext('2d');
        
        // Partikel konfeti
        let particles = [];
        const particleCount = 220;
        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h - h,
                size: Math.random() * 9 + 3,
                color: `hsl(${Math.random() * 360}, 85%, 65%)`,
                speedY: Math.random() * 8 + 5,
                speedX: (Math.random() - 0.5) * 4,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.2
            });
        }
        
        // Bintang
        let stars = [];
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                size: Math.random() * 4 + 2,
                alpha: Math.random() * 0.8 + 0.3,
            });
        }
        
        let startTime = performance.now();
        let duration = 4000; // 4 detik, tombol tetap ada sampai konfeti hilang
        
        let displayText = `🏆 ${winnerName} 🏆`;
        let subText = `Mendapatkan ${prizeName}! 🎉`;
        
        function animateConfetti(now) {
            const elapsed = now - startTime;
            if (elapsed > duration) {
                confettiCanvas.remove();
                // Hapus tombol try again setelah confetti selesai jika belum di-click
                if (tryAgainBtn && tryAgainBtn.parentNode) {
                    tryAgainBtn.remove();
                    if (activeTryAgainBtn === tryAgainBtn) activeTryAgainBtn = null;
                }
                return;
            }
            
            ctxc.clearRect(0, 0, w, h);
            
            for (let p of particles) {
                p.y += p.speedY;
                p.x += p.speedX;
                p.rotation += p.rotSpeed;
                ctxc.save();
                ctxc.translate(p.x, p.y);
                ctxc.rotate(p.rotation);
                ctxc.fillStyle = p.color;
                ctxc.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctxc.restore();
            }
            
            for (let s of stars) {
                ctxc.fillStyle = `rgba(255, 215, 0, ${s.alpha + Math.sin(now * 0.008) * 0.2})`;
                ctxc.beginPath();
                ctxc.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctxc.fill();
            }
            
            const textAlpha = Math.min(1, elapsed / 400) * (1 - Math.max(0, (elapsed - 2000) / 2000));
            
            ctxc.save();
            ctxc.shadowBlur = 15;
            ctxc.shadowColor = "rgba(0,0,0,0.5)";
            ctxc.font = `bold ${Math.min(48, 36 + Math.sin(now * 0.015) * 4)}px 'Poppins', 'Segoe UI'`;
            ctxc.textAlign = "center";
            ctxc.textBaseline = "middle";
            
            const grad = ctxc.createLinearGradient(w/2 - 150, h/2 - 50, w/2 + 150, h/2 + 30);
            grad.addColorStop(0, '#FFD966');
            grad.addColorStop(0.5, '#FFA559');
            grad.addColorStop(1, '#FF6B35');
            ctxc.fillStyle = grad;
            ctxc.globalAlpha = textAlpha;
            ctxc.fillText(displayText, w/2, h/2 - 40);
            
            ctxc.font = `bold ${Math.min(32, 26 + Math.sin(now * 0.02) * 3)}px 'Poppins', 'Segoe UI'`;
            ctxc.fillStyle = '#FFE0A3';
            ctxc.fillText(subText, w/2, h/2 + 30);
            
            ctxc.font = `bold ${Math.min(48, 36)}px 'Poppins', 'Segoe UI'`;
            ctxc.fillStyle = 'rgba(255,215,0,0.2)';
            ctxc.globalAlpha = 0.3 + Math.sin(now * 0.02) * 0.2;
            ctxc.fillText(displayText, w/2 + 3, h/2 - 37);
            ctxc.fillText(displayText, w/2 - 3, h/2 - 43);
            ctxc.restore();
            
            requestAnimationFrame(animateConfetti);
        }
        
        requestAnimationFrame(animateConfetti);
    }

    // ---------- LOAD DATA TAMU DARI RSVP & FILTER NAMA YANG DIEXCLUDE ----------
    async function loadGuests() {
        showLoading(true);
        try {
            const snap = await rsvpRef.once('value');
            const data = snap.val();
            let rawGuests = [];
            if (data) {
                rawGuests = Object.keys(data).map(key => ({
                    id: key,
                    name: data[key].name || 'Tanpa Nama',
                    company: data[key].company || '-'
                })).filter(g => g.name && g.name.trim() !== '');
            }
            // Filter: HAPUS tamu yang namanya ada di excludedNames (case-insensitive, trim)
            guestsList = rawGuests.filter(guest => {
                const guestNameTrim = guest.name.trim();
                return !excludedNames.some(excluded => 
                    guestNameTrim.toLowerCase() === excluded.toLowerCase()
                );
            });
            
            await loadWinnersHistory();
            updateAvailableIndices();
            renderPrizeOptions();
            drawWheel();
            updateStatsUI();
            if (guestsList.length === 0) showToast("Tidak ada peserta yang tersedia setelah filter", true);
            else showToast(`Berhasil memuat ${guestsList.length} peserta (telah exclude nama tertentu)`, false);
        } catch(e) { showToast("Gagal muat data", true); } 
        finally { showLoading(false); }
    }

    async function loadWinnersHistory() {
        const snap = await winnersRef.once('value');
        const data = snap.val();
        if (data) {
            winnersHistory = Object.keys(data).map(key => ({ id: key, ...data[key] }))
                .sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
        } else { winnersHistory = []; }
        resetPrizeStockFromHistory();
        renderHistory();
        updateStatsUI();
    }

    function resetPrizeStockFromHistory() {
        // Reset semua stok ke nilai awal
        prizes.forEach(p => p.stock = p.initialStock);
        // Kurangi berdasarkan history pemenang yang sudah tersimpan di Firebase
        winnersHistory.forEach(w => {
            const prizeName = w.prize;
            const prizeItem = prizes.find(p => p.name === prizeName);
            if (prizeItem && prizeItem.stock > 0) prizeItem.stock--;
        });
        // Pastikan stok voucher MAP tidak negatif (karena mungkin sudah 2 keluar -> stok 3)
        renderPrizeOptions();
    }

    function updateAvailableIndices() {
        const winnerNames = new Set(winnersHistory.map(w => w.name));
        availableIndices = [];
        for (let i = 0; i < guestsList.length; i++) {
            if (!winnerNames.has(guestsList[i].name)) availableIndices.push(i);
        }
        spinBtn.disabled = (availableIndices.length === 0);
        if (availableIndices.length === 0 && guestsList.length) showToast("Semua tamu sudah pernah menang! Reset history untuk spin lagi", false);
        updateStatsUI();
    }

    function updateStatsUI() {
        document.getElementById('totalGuests').innerText = guestsList.length;
        document.getElementById('wonCount').innerText = winnersHistory.length;
        document.getElementById('remainingCount').innerText = guestsList.length - winnersHistory.length;
    }

    function renderPrizeOptions() {
        const container = document.getElementById('prizeContainer');
        container.innerHTML = prizes.map(prize => `
            <div class="prize-card ${selectedPrize?.id === prize.id ? 'selected' : ''} ${prize.stock <= 0 ? 'disabled' : ''}" data-id="${prize.id}">
                <div class="prize-icon">${prize.icon}</div>
                <div class="prize-name">${prize.name}</div>
                <div class="prize-stock"><i class="fas fa-boxes"></i> Sisa: ${prize.stock}</div>
            </div>
        `).join('');
        document.querySelectorAll('.prize-card').forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = card.getAttribute('data-id');
                const prize = prizes.find(p => p.id === id);
                if (!prize || prize.stock <= 0) {
                    showToast(`Stok ${prize?.name} habis!`, true);
                    return;
                }
                if (currentSpinInProgress) {
                    showToast("Tunggu spin selesai sebelum ganti hadiah", true);
                    return;
                }
                selectedPrize = prize;
                renderPrizeOptions();
                showToast(`Hadiah dipilih: ${prize.name}`, false);
            });
        });
    }

    function drawWheel() {
        if (!guestsList.length || availableIndices.length === 0) {
            ctx.clearRect(0, 0, 500, 500);
            ctx.fillStyle = "#FFD966";
            ctx.font = "bold 16px 'Segoe UI'";
            ctx.fillText("Tidak ada peserta", 170, 250);
            return;
        }
        const segmentIndices = [...availableIndices];
        wheelSegments = segmentIndices.map(idx => guestsList[idx]);
        const count = wheelSegments.length;
        const angleStep = (Math.PI * 2) / count;
        for (let i = 0; i < count; i++) {
            const start = i * angleStep + currentRotation;
            const end = (i + 1) * angleStep + currentRotation;
            const hue = (i * 45) % 360;
            ctx.beginPath();
            ctx.fillStyle = `hsl(${hue}, 70%, 55%)`;
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, start, end);
            ctx.fill();
            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(start + angleStep / 2);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            let shortName = wheelSegments[i].name.length > 15 ? wheelSegments[i].name.substring(0,13)+".." : wheelSegments[i].name;
            ctx.font = "bold 13px 'Segoe UI'";
            ctx.fillStyle = "#1a1f2e";
            ctx.fillText(shortName, 125, 5);
            ctx.font = "9px 'Segoe UI'";
            ctx.fillStyle = "#2c2e3a";
            let shortComp = wheelSegments[i].company.length > 14 ? wheelSegments[i].company.substring(0,11)+".." : wheelSegments[i].company;
            ctx.fillText(shortComp, 125, 22);
            ctx.restore();
        }
        ctx.beginPath();
        ctx.moveTo(475, 240);
        ctx.lineTo(495, 250);
        ctx.lineTo(475, 260);
        ctx.fillStyle = "#FFD966";
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText("⬆️", 478, 245);
    }

    // Fungsi untuk menghapus pemenang terakhir (Try Again) tanpa mengurangi stok hadiah lagi
    // Karena hadiah sudah berkurang saat simpan, maka kita perlu mengembalikan stok dan menghapus record
    async function rollbackLastWinner(winnerData, prizeName) {
        try {
            // Cari record terakhir yang namanya sama dengan winnerData.name dan hadiahnya prizeName
            // Kita ambil dari winnersHistory yang paling baru (asumsi yang terakhir adalah yang baru disimpan)
            const lastWinnerRecord = winnersHistory.find(w => w.name === winnerData.name && w.prize === prizeName);
            if (!lastWinnerRecord || !lastWinnerRecord.id) {
                showToast("Gagal menemukan data pemenang untuk dirollback", true);
                return false;
            }
            // Hapus dari Firebase
            await winnersRef.child(lastWinnerRecord.id).remove();
            
            // Kembalikan stok hadiah
            const prizeItem = prizes.find(p => p.name === prizeName);
            if (prizeItem) {
                prizeItem.stock++;
                renderPrizeOptions();
            }
            // Reload ulang history dan update state
            await loadWinnersHistory();
            updateAvailableIndices();
            drawWheel();
            updateStatsUI();
            
            // Kosongkan tampilan pemenang terbaru jika sesuai
            const currentWinnerNameElem = document.getElementById('winnerName').innerText;
            if (currentWinnerNameElem === winnerData.name) {
                document.getElementById('winnerName').innerHTML = "—";
                document.getElementById('winnerCompany').innerHTML = "—";
                document.getElementById('winnerPrizeDisplay').innerHTML = "—";
            }
            showToast(`✅ ${winnerData.name} ditandai tidak hadih, hadiah dikembalikan`, false);
            return true;
        } catch(e) {
            showToast("Gagal rollback pemenang", true);
            return false;
        }
    }

    async function spinWheel() {
        if (currentSpinInProgress) { showToast("Spin sedang berjalan...", true); return; }
        if (!guestsList.length) { showToast("Data tamu kosong", true); return; }
        if (availableIndices.length === 0) { showToast("Semua tamu sudah pernah menang! Reset history", true); return; }
        if (!selectedPrize) { showToast("Silakan pilih hadiah terlebih dahulu!", true); return; }
        if (selectedPrize.stock <= 0) { showToast(`Stok ${selectedPrize.name} habis, pilih hadiah lain`, true); return; }

        currentSpinInProgress = true;
        spinBtn.disabled = true;

        const randomIdx = Math.floor(Math.random() * availableIndices.length);
        const winnerGlobalIdx = availableIndices[randomIdx];
        const winner = guestsList[winnerGlobalIdx];

        const segmentPos = wheelSegments.findIndex(seg => seg.name === winner.name && seg.company === winner.company);
        if (segmentPos === -1) {
            currentSpinInProgress = false;
            spinBtn.disabled = false;
            showToast("Error internal, coba lagi", true);
            return;
        }
        const totalSeg = wheelSegments.length;
        const anglePer = (Math.PI * 2) / totalSeg;
        let targetRot = (- (segmentPos * anglePer) - (anglePer/2));
        const extraRounds = (Math.random() * 8 + 10) * 2 * Math.PI;
        let finalDelta = targetRot - (currentRotation % (Math.PI*2)) + extraRounds;
        const startRotation = currentRotation;
        const startTime = performance.now();
        const SPIN_DURATION = 8000;

        function animateSpin(now) {
            const elapsed = now - startTime;
            let t = Math.min(1, elapsed / SPIN_DURATION);
            const ease = 1 - Math.pow(1 - t, 3);
            const newRotation = startRotation + finalDelta * ease;
            currentRotation = newRotation % (Math.PI * 2);
            drawWheel();
            if (t < 1) {
                requestAnimationFrame(animateSpin);
            } else {
                currentRotation = targetRot;
                while (currentRotation < 0) currentRotation += Math.PI*2;
                currentRotation %= Math.PI*2;
                drawWheel();
                // Simpan pemenang lalu tampilkan konfeti dengan tombol try again
                saveWinnerWithPrizeAndConfetti(winner, selectedPrize.name);
                currentSpinInProgress = false;
                spinBtn.disabled = false;
            }
        }
        requestAnimationFrame(animateSpin);
    }

    async function saveWinnerWithPrizeAndConfetti(winner, prizeName) {
        try {
            const prizeItem = prizes.find(p => p.name === prizeName);
            if (!prizeItem || prizeItem.stock <= 0) {
                showToast(`Maaf, stok ${prizeName} sudah habis!`, true);
                return;
            }
            prizeItem.stock--;
            renderPrizeOptions();

            const newWinner = {
                name: winner.name,
                company: winner.company,
                prize: prizeName,
                timestamp: Date.now()
            };
            const newRef = await winnersRef.push(newWinner);
            await loadWinnersHistory(); // reload ulang agar history sinkron
            updateAvailableIndices();
            drawWheel();
            updateStatsUI();
            
            document.getElementById('winnerName').innerHTML = winner.name;
            document.getElementById('winnerCompany').innerHTML = `<i class="fas fa-building"></i> ${winner.company}`;
            document.getElementById('winnerPrizeDisplay').innerHTML = `<i class="fas fa-gift"></i> ${prizeName}`;
            
            // Siapkan fungsi rollback untuk tombol Try Again (menghapus pemenang terakhir)
            const rollbackHandler = async () => {
                await rollbackLastWinner(winner, prizeName);
            };
            
            // Tampilkan konfeti dengan tombol try again
            startWinnerConfetti(winner.name, prizeName, rollbackHandler);
            
            showToast(`🎉 Selamat! ${winner.name} mendapatkan ${prizeName} 🎉`, false);
        } catch(e) { showToast("Gagal simpan pemenang", true); }
    }

    async function resetAllWinners() {
        if (!confirm("⚠️ RESET TOTAL: Semua history pemenang dan stok hadiah akan dikembalikan. Lanjutkan?")) return;
        showLoading(true);
        try {
            await winnersRef.remove();
            winnersHistory = [];
            prizes.forEach(p => p.stock = p.initialStock);
            selectedPrize = null;
            renderPrizeOptions();
            await loadWinnersHistory();
            updateAvailableIndices();
            drawWheel();
            updateStatsUI();
            document.getElementById('winnerName').innerHTML = "—";
            document.getElementById('winnerCompany').innerHTML = "—";
            document.getElementById('winnerPrizeDisplay').innerHTML = "—";
            showToast("Semua data pemenang telah direset!", false);
        } catch(e) { showToast("Gagal reset", true); }
        finally { showLoading(false); }
    }

    function renderHistory() {
        const historyDiv = document.getElementById('historyList');
        if (!winnersHistory.length) {
            historyDiv.innerHTML = '<div style="text-align:center; color:#aaa; padding:15px;">Belum ada pemenang, putar roda!</div>';
            return;
        }
        historyDiv.innerHTML = winnersHistory.map(w => `
            <div class="history-item">
                <span class="history-name"><i class="fas fa-user-check"></i> ${escapeHtml(w.name)}</span>
                <span class="history-prize">🎁 ${escapeHtml(w.prize)}</span>
                <span class="history-date">${new Date(w.timestamp).toLocaleString('id-ID')}</span>
            </div>
        `).join('');
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    document.getElementById('spinButton').addEventListener('click', spinWheel);
    document.getElementById('resetAllBtn').addEventListener('click', resetAllWinners);

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('access') !== 'admin2026') {
        const pwd = prompt('🔐 Password Admin Lucky Draw:');
        if (pwd !== 'admin2026') { alert('Akses ditolak!'); window.location.href = 'index.html'; }
    }

    loadGuests().then(() => drawWheel());
    window.addEventListener('resize', () => drawWheel());
</script>
