<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Data RSVP Undangan Pernikahan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        /* Navbar */
        .navbar {
            background: linear-gradient(135deg, #2c3e50 0%, #1e2b37 100%);
            color: white;
            padding: 20px 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .navbar h1 {
            font-weight: 300;
            font-size: 1.8rem;
        }

        .navbar h1 i {
            color: #e67e22;
            margin-right: 10px;
        }

        .stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card .label {
            font-size: 0.8rem;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e67e22;
            line-height: 1.2;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Actions Panel */
        .actions-panel {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }

        .btn-info {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-info:hover {
            transform: translateY(-2px);
        }

        /* Search Box */
        .search-wrapper {
            flex: 1;
            max-width: 350px;
            position: relative;
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1);
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 10px 25px;
            border-radius: 30px;
            background: white;
            border: 2px solid transparent;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            color: #555;
        }

        .filter-tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .filter-tab.active {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border-color: transparent;
        }

        /* Table */
        .table-wrapper {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow-x: auto;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: linear-gradient(135deg, #34495e, #2c3e50);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ecf0f1;
        }

        tr:hover {
            background: #f8f9fa;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-hadir {
            background: #d4edda;
            color: #155724;
            border-left: 3px solid #28a745;
        }

        .badge-tidak {
            background: #f8d7da;
            color: #721c24;
            border-left: 3px solid #dc3545;
        }

        .badge-ragu {
            background: #fff3cd;
            color: #856404;
            border-left: 3px solid #ffc107;
        }

        /* Action Buttons */
        .action-icons {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            font-size: 0.85rem;
        }

        .icon-btn.view {
            background: #17a2b8;
        }

        .icon-btn.view:hover {
            background: #138496;
            transform: scale(1.05);
        }

        .icon-btn.delete {
            background: #dc3545;
        }

        .icon-btn.delete:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 15px;
            opacity: 0.4;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #34495e, #2c3e50);
            color: white;
            border-radius: 20px 20px 0 0;
        }

        .modal-header h2 {
            font-size: 1.4rem;
            font-weight: 500;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }

        .modal-close:hover {
            color: #e67e22;
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 25px;
        }

        .detail-group {
            margin-bottom: 18px;
            border-bottom: 1px dashed #ecf0f1;
            padding-bottom: 12px;
        }

        .detail-group strong {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-group .detail-value {
            color: #555;
            font-size: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .modal-footer {
            padding: 20px 25px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #e67e22;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2c3e50;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 1500;
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s;
        }

        .toast.show {
            display: flex;
        }

        .toast.success {
            background: #27ae60;
        }

        .toast.error {
            background: #e74c3c;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .navbar h1 {
                font-size: 1.2rem;
            }

            .stat-card {
                padding: 8px 12px;
            }

            .stat-card .value {
                font-size: 1.2rem;
            }

            .stat-card .label {
                font-size: 0.7rem;
            }

            .actions-panel {
                flex-direction: column;
            }

            .search-wrapper {
                max-width: 100%;
                width: 100%;
            }

            .filter-tab {
                padding: 6px 15px;
                font-size: 0.85rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h1>
        <i class="fas fa-chalkboard-user"></i> Admin Panel - RSVP Undangan
    </h1>
    <div class="stats">
        <div class="stat-card">
            <div class="label">📋 TOTAL RSVP</div>
            <div class="value" id="totalCount">0</div>
        </div>
        <div class="stat-card">
            <div class="label">👥 TOTAL ORANG HADIR</div>
            <div class="value" id="totalOrangHadir">0</div>
        </div>
        <div class="stat-card">
            <div class="label">✅ RSVP HADIR</div>
            <div class="value" id="hadirCount">0</div>
        </div>
        <div class="stat-card">
            <div class="label">❌ TIDAK HADIR</div>
            <div class="value" id="tidakCount">0</div>
        </div>
        <div class="stat-card">
            <div class="label">🤔 RAGU</div>
            <div class="value" id="raguCount">0</div>
        </div>
    </div>
</div>

<!-- Main Container -->
<div class="container">
    <!-- Actions Panel -->
    <div class="actions-panel">
        <div class="btn-group">
            <button class="btn btn-success" onclick="exportToExcel()">
                <i class="fas fa-file-excel"></i> Export Excel
            </button>
            <button class="btn btn-info" onclick="exportToCSV()">
                <i class="fas fa-file-csv"></i> Export CSV
            </button>
            <button class="btn btn-danger" onclick="clearAllData()">
                <i class="fas fa-trash-alt"></i> Hapus Semua
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i> Kembali
            </button>
        </div>
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Cari nama, perusahaan, atau telepon...">
        </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
        <div class="filter-tab active" data-filter="all">Semua (<span id="filterAllCount">0</span>)</div>
        <div class="filter-tab" data-filter="Hadir">✅ Hadir (<span id="filterHadirCount">0</span>)</div>
        <div class="filter-tab" data-filter="Tidak Hadir">❌ Tidak Hadir (<span id="filterTidakCount">0</span>)</div>
        <div class="filter-tab" data-filter="Ragu">🤔 Ragu (<span id="filterRaguCount">0</span>)</div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
        <table id="rsvpTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th><i class="fas fa-user"></i> Nama</th>
                    <th><i class="fas fa-building"></i> Perusahaan</th>
                    <th><i class="fas fa-phone"></i> Telepon</th>
                    <th><i class="fas fa-calendar-check"></i> Kehadiran</th>
                    <th><i class="fas fa-users"></i> Jumlah Tamu</th>
                    <th><i class="fas fa-cog"></i> Aksi</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="7" class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>Belum ada data RSVP</p>
                        <small>Data akan muncul setelah tamu mengisi form</small>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Detail -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-info-circle"></i> Detail RSVP</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- Dynamic content -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal()">Tutup</button>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage">Pesan</span>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    // ==================== FIREBASE CONFIGURATION ====================
    const firebaseConfig = {
        apiKey: "AIzaSyC8LlcI_ccRGieFNjlVFLfEr2c4PBg6J70",
        authDomain: "logbook-e6ab3.firebaseapp.com",
        databaseURL: "https://logbook-e6ab3-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "logbook-e6ab3",
        storageBucket: "logbook-e6ab3.firebasestorage.app",
        messagingSenderId: "484546392348",
        appId: "1:484546392348:web:861616b680427c158ecad9"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const rsvpRef = database.ref('rsvps');

    // ==================== GLOBAL VARIABLES ====================
    let allData = [];
    let currentFilter = 'all';
    let currentSearch = '';

    // ==================== HELPER FUNCTIONS ====================
    function showLoading(show) {
        const overlay = document.getElementById('loadingOverlay');
        if (show) {
            overlay.classList.add('show');
        } else {
            overlay.classList.remove('show');
        }
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        toastMessage.textContent = message;
        toast.className = 'toast show ' + type;
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    function escapeHtml(text) {
        if (!text) return '-';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatDate(timestamp) {
        if (!timestamp) return 'Tanggal tidak tersedia';
        const date = new Date(timestamp);
        return date.toLocaleString('id-ID', {
            dateStyle: 'full',
            timeStyle: 'medium'
        });
    }

    // ==================== DATA PROCESSING ====================
    function loadData() {
        showLoading(true);
        rsvpRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                allData = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key],
                    guestCount: data[key].guestCount ? parseInt(data[key].guestCount) : 1
                })).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            } else {
                allData = [];
            }
            updateStatistics();
            applyFilters();
            showLoading(false);
        }, (error) => {
            console.error('Error:', error);
            showLoading(false);
            showToast('Gagal memuat data! Periksa koneksi internet.', 'error');
        });
    }

    function updateStatistics() {
        const total = allData.length;
        const hadir = allData.filter(item => item.attendance === 'Hadir').length;
        const tidak = allData.filter(item => item.attendance === 'Tidak Hadir').length;
        const ragu = allData.filter(item => item.attendance === 'Ragu').length;
        
        // Hitung total orang yang benar-benar hadir (berdasarkan jumlah tamu)
        let totalOrangHadir = 0;
        allData.forEach(item => {
            if (item.attendance === 'Hadir') {
                totalOrangHadir += (item.guestCount > 0 ? item.guestCount : 1);
            }
        });

        // Update navbar stats
        document.getElementById('totalCount').textContent = total;
        document.getElementById('totalOrangHadir').textContent = totalOrangHadir;
        document.getElementById('hadirCount').textContent = hadir;
        document.getElementById('tidakCount').textContent = tidak;
        document.getElementById('raguCount').textContent = ragu;

        // Update filter tab counts
        document.getElementById('filterAllCount').textContent = total;
        document.getElementById('filterHadirCount').textContent = hadir;
        document.getElementById('filterTidakCount').textContent = tidak;
        document.getElementById('filterRaguCount').textContent = ragu;
    }

    function applyFilters() {
        let filtered = [...allData];

        // Apply status filter
        if (currentFilter !== 'all') {
            filtered = filtered.filter(item => item.attendance === currentFilter);
        }

        // Apply search filter
        if (currentSearch.trim() !== '') {
            const searchLower = currentSearch.toLowerCase();
            filtered = filtered.filter(item => 
                (item.name && item.name.toLowerCase().includes(searchLower)) ||
                (item.company && item.company.toLowerCase().includes(searchLower)) ||
                (item.phone && item.phone.toLowerCase().includes(searchLower))
            );
        }

        renderTable(filtered);
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        
        if (data.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>Tidak ada data yang ditemukan</p>
                        <small>Coba ubah kata kunci pencarian atau filter</small>
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = data.map((item, index) => {
            const badgeClass = {
                'Hadir': 'badge-hadir',
                'Tidak Hadir': 'badge-tidak',
                'Ragu': 'badge-ragu'
            }[item.attendance] || '';

            const guestDisplay = `${item.guestCount || 1} orang`;
            
            return `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${escapeHtml(item.name)}</strong></td>
                    <td>${escapeHtml(item.company)}</td>
                    <td>${escapeHtml(item.phone)}</td>
                    <td><span class="badge ${badgeClass}">${escapeHtml(item.attendance)}</span></td>
                    <td><i class="fas fa-user-friends"></i> ${guestDisplay}</td>
                    <td>
                        <div class="action-icons">
                            <button class="icon-btn view" onclick="viewDetail('${item.id}')" title="Detail">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="icon-btn delete" onclick="deleteItem('${item.id}')" title="Hapus">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // ==================== CRUD OPERATIONS ====================
    function viewDetail(id) {
        const item = allData.find(d => d.id === id);
        if (!item) return;

        const modalBody = document.getElementById('modalBody');
        modalBody.innerHTML = `
            <div class="detail-group">
                <strong><i class="fas fa-user"></i> Nama Lengkap</strong>
                <div class="detail-value">${escapeHtml(item.name) || '-'}</div>
            </div>
            <div class="detail-group">
                <strong><i class="fas fa-building"></i> Perusahaan / Instansi</strong>
                <div class="detail-value">${escapeHtml(item.company) || '-'}</div>
            </div>
            <div class="detail-group">
                <strong><i class="fas fa-phone"></i> Nomor Telepon</strong>
                <div class="detail-value">${escapeHtml(item.phone) || '-'}</div>
            </div>
            <div class="detail-group">
                <strong><i class="fas fa-calendar-check"></i> Konfirmasi Kehadiran</strong>
                <div class="detail-value">
                    <span class="badge ${item.attendance === 'Hadir' ? 'badge-hadir' : item.attendance === 'Tidak Hadir' ? 'badge-tidak' : 'badge-ragu'}">
                        ${escapeHtml(item.attendance)}
                    </span>
                </div>
            </div>
            <div class="detail-group">
                <strong><i class="fas fa-users"></i> Jumlah Tamu yang Dibawa</strong>
                <div class="detail-value">${item.guestCount || 1} orang</div>
            </div>
            <div class="detail-group">
                <strong><i class="fas fa-comment"></i> Pesan / Ucapan</strong>
                <div class="detail-value">${escapeHtml(item.message) || 'Tidak ada pesan'}</div>
            </div>
            <div class="detail-group">
                <strong><i class="fas fa-clock"></i> Waktu Pengisian</strong>
                <div class="detail-value">${formatDate(item.timestamp)}</div>
            </div>
        `;
        
        document.getElementById('detailModal').classList.add('show');
    }

    function deleteItem(id) {
        if (confirm('⚠️ Apakah Anda yakin ingin menghapus data ini? Data akan hilang permanen!')) {
            showLoading(true);
            rsvpRef.child(id).remove()
                .then(() => {
                    showLoading(false);
                    showToast('Data berhasil dihapus!', 'success');
                })
                .catch((error) => {
                    showLoading(false);
                    showToast('Gagal menghapus data!', 'error');
                    console.error(error);
                });
        }
    }

    function clearAllData() {
        if (confirm('🔴 PERINGATAN BERAT! 🔴\n\nSemua data RSVP akan dihapus PERMANEN!\nTindakan ini TIDAK DAPAT DIBATALKAN.\n\nApakah Anda benar-benar yakin?')) {
            const doubleConfirm = confirm('Ketik "HAPUS" untuk mengkonfirmasi penghapusan semua data');
            if (doubleConfirm) {
                showLoading(true);
                rsvpRef.remove()
                    .then(() => {
                        showLoading(false);
                        showToast('Semua data berhasil dihapus!', 'success');
                    })
                    .catch((error) => {
                        showLoading(false);
                        showToast('Gagal menghapus data!', 'error');
                        console.error(error);
                    });
            }
        }
    }

    // ==================== EXPORT FUNCTIONS ====================
    function exportToExcel() {
        if (allData.length === 0) {
            showToast('Tidak ada data untuk diekspor!', 'error');
            return;
        }

        const exportData = allData.map((item, index) => ({
            'No': index + 1,
            'Nama Lengkap': item.name || '-',
            'Perusahaan': item.company || '-',
            'Telepon': item.phone || '-',
            'Kehadiran': item.attendance || '-',
            'Jumlah Tamu': item.guestCount || 1,
            'Pesan': item.message || '-',
            'Waktu Daftar': formatDate(item.timestamp)
        }));

        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Data RSVP');
        
        const fileName = `RSVP_Data_${new Date().toISOString().split('T')[0]}.xlsx`;
        XLSX.writeFile(wb, fileName);
        showToast('Export Excel berhasil!', 'success');
    }

    function exportToCSV() {
        if (allData.length === 0) {
            showToast('Tidak ada data untuk diekspor!', 'error');
            return;
        }

        const exportData = allData.map((item, index) => ({
            'No': index + 1,
            'Nama Lengkap': item.name || '-',
            'Perusahaan': item.company || '-',
            'Telepon': item.phone || '-',
            'Kehadiran': item.attendance || '-',
            'Jumlah Tamu': item.guestCount || 1,
            'Pesan': (item.message || '-').replace(/,/g, ';'),
            'Waktu Daftar': formatDate(item.timestamp)
        }));

        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Data RSVP');
        
        const fileName = `RSVP_Data_${new Date().toISOString().split('T')[0]}.csv`;
        XLSX.writeFile(wb, fileName);
        showToast('Export CSV berhasil!', 'success');
    }

    // ==================== EVENT LISTENERS ====================
    document.getElementById('searchInput').addEventListener('input', (e) => {
        currentSearch = e.target.value;
        applyFilters();
    });

    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentFilter = tab.getAttribute('data-filter');
            applyFilters();
        });
    });

    function closeModal() {
        document.getElementById('detailModal').classList.remove('show');
    }

    window.onclick = function(event) {
        const modal = document.getElementById('detailModal');
        if (event.target === modal) {
            closeModal();
        }
    }

    // ==================== INITIALIZATION ====================
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        
        // Admin authentication
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('access') !== 'admin2026') {
            const password = prompt('🔐 Masukkan Password Admin:');
            if (password !== 'admin2026') {
                alert('Password salah! Akses ditolak.');
                window.location.href = 'index.html';
            }
        }
    });
</script>
</body>
</html>
